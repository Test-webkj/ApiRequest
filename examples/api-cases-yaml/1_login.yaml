基础配置:  #后续测试报告中显示
  用例类型: ApiCase
  用例标题: 登录用例标题
  一级模块: 登录模块
  二级模块: 登录功能

前置脚本: ""
#  - "context.update({'username':'test_user_001'})"

后置脚本: ""
#  - "print('后置脚本')"

用例步骤:
- 发送登录接口:
    操作类型: 发送请求POST
    请求地址: "{{URL}}"
    URL参数:
      s: /api/user/login
      application: app
      application_client_type: weixin
    请求数据:
      accounts: "test_user_001"
      pwd: "Test@123456"
      type: "username"

- 提取响应数据token:
    操作类型: 提取数据JSON
    表达式: $..token
    变量名: msg_token

- 提取响应数据msg:
    操作类型: 提取数据JSON
    表达式: $..msg
    变量名: sj_msg